name: checks

# Fast gate on every push and pull request: the e2e suite compiles and loads,
# and the SUT backend starts and answers. Must always be green.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            sut/backend/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Type-check e2e suite
        working-directory: e2e
        run: npx tsc --noEmit

      - name: Load Playwright config and list tests
        working-directory: e2e
        run: npx playwright test --list

      - name: Install backend dependencies
        working-directory: sut/backend
        run: npm ci

      - name: Start backend and check it responds
        working-directory: sut/backend
        run: |
          node server.js > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/products > /dev/null; then
              echo "Backend is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not respond within 30s"
          cat backend.log
          exit 1
