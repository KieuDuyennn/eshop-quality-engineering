name: e2e

# Full Playwright suite against a locally started SUT, one job per browser.
# Many cases fail on purpose because they expose real SUT defects, so the test
# step does not fail the job yet; results are published as a summary and report.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Official image with all browsers and their system libraries preinstalled,
    # so no apt download is needed. Keep the tag equal to the @playwright/test
    # version in e2e/package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      # Firefox refuses to run as root unless HOME points at root's home.
      HOME: /root
      FEATURE: all
      BROWSER: ${{ matrix.browser }}
      BASE_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      API_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            sut/backend/package-lock.json
            sut/frontend-web/package-lock.json
            sut/frontend-admin/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix e2e
          npm ci --prefix sut/backend
          npm ci --prefix sut/frontend-web
          npm ci --prefix sut/frontend-admin

      # LOADTEST=1 turns off the backend's 200 requests / 15 min limiter. The whole
      # suite runs in one go against one backend and would otherwise hit HTTP 429
      # partway through; no test case exercises the limiter itself.
      - name: Start SUT
        run: |
          mkdir -p logs
          (cd sut/backend && LOADTEST=1 node server.js > ../../logs/backend.log 2>&1 &)
          (cd sut/frontend-web && npm run dev > ../../logs/frontend-web.log 2>&1 &)
          (cd sut/frontend-admin && npm run dev > ../../logs/frontend-admin.log 2>&1 &)

      - name: Wait for SUT
        run: |
          for url in http://localhost:3000/api/products http://localhost:5173 http://localhost:5174; do
            for i in $(seq 1 60); do
              if node .github/scripts/url-ready.mjs "$url"; then
                echo "$url is up after ${i}s"
                continue 2
              fi
              sleep 1
            done
            echo "$url did not respond within 60s"
            tail -n 50 logs/*.log
            exit 1
          done

      - name: Run Playwright (${{ matrix.browser }})
        id: tests
        continue-on-error: true
        working-directory: e2e
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUT_JWT_SECRET: ${{ secrets.SUT_JWT_SECRET }}
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Write job summary
        if: always()
        run: >
          node .github/scripts/e2e-summary.mjs
          e2e/playwright-report/json/all-${{ matrix.browser }}.json
          ${{ matrix.browser }} >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload SUT logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sut-logs-${{ matrix.browser }}
          path: logs/
          retention-days: 14
